<!DOCTYPE html>
<html>
<head>
    <title>Detection Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: color 0.3s;
        }

        a:hover {
            color: #45a049;
        }
        img { max-width: 100%; border-radius: 6px; }
        .notice { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ label }}</h1>
        <p>Model confidence: <strong>{{ confidence }}</strong></p>
        <p>Visualized contour regions: <strong>{{ contour_count }}</strong></p>
        <img src="data:image/jpeg;base64,{{ result_image }}" alt="Annotated analysis result">
        <p class="notice">Academic prototype only. This output is not a medical diagnosis.</p>
        <a href="{% url 'upload' %}">Upload another image</a>
    </div>
</body>
</html>
